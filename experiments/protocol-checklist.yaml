# Comparability Protocol for Benchmarking Relational Database Access Layers
# ---------------------------------------------------------------------------
# Machine-readable checklist (reviewer point 12, O1). Encodes the protocol
# specified normatively in the manuscript's Study Design (Figure 1 and the
# protocol-mapping table, Table 2) so that any access-layer benchmark can be
# audited against it programmatically. Each stage lists: what it requires, how
# to check it, the failure that follows if it is skipped, and how THIS study
# satisfies it. Fields are stable identifiers intended for tooling.
#
# Schema (informal):
#   inputs[]            : the four declared inputs a protocol instance must fix
#   stages.mandatory[]  : defines a stable, semantically admitted comparison
#   stages.recommended[]: licenses additional interpretations; may be scoped
#   cell_admission      : the per-cell pass/fail gate applied before timing
#   outputs             : what the protocol licenses reporting, and how to read it
#   applicability_limits: when byte-identical comparison is valid and which comparator is declared
#   compliance_levels[] : named coverage levels an instantiation may reach

protocol:
  name: "Comparability Protocol for Benchmarking Relational Database Access Layers in Express.js"
  author: "Mateusz Miotk, University of Gdansk"
  release: "v1.13.16, 2026-07-26"
  doi: "10.5281/zenodo.21313858 (concept DOI, resolves to the release; the Zenodo record also carries a per-version DOI)"
  spec_location: "manuscript Study Design (sec:protocol); Figure 1; Table 2 (protocol mapping)"

inputs:
  - id: IN1
    name: treatments
    requirement: "The set of implementations under comparison, each a configured bundle (library, version, and its query/loading strategy), not the library name alone."
  - id: IN2
    name: declared_workload_model
    requirement: "Stated access patterns (not a captured production trace), fixed for all treatments."
  - id: IN3
    name: output_equivalence_semantics
    requirement: "A definition of when two responses count as equivalent (byte-identical, set equality, numeric tolerance, or canonicalization)."
  - id: IN4
    name: operating_point_definition
    requirement: "An explicit separation of capacity, external demand, and utilization; every reported number is tied to one operating point."

stages:
  mandatory:
    - id: M1
      name: semantic_admission
      requirement: "Admit a treatment only if reads satisfy an expected-result oracle derived independently from the timed native implementation, implementations are mutually equivalent under the declared comparator, and mutations produce the intended database state - not merely a 2xx status."
      check: "Specification-derived expected-result checks plus differential equivalence for reads; field-, identifier-, row-count-, and rollback-level checks for writes."
      failure_if_skipped: "A layer that returns fewer fields, writes wrong, or errors faster than it works can appear faster - a spurious ranking."
      this_study: "bench/verify-spec.mjs replays the deterministic seed specification without using native-driver output (73,080 expected-result checks); bench/verify-seed-parity.mjs establishes identical declared fan-out values and generated identifiers across the engines; bench/verify.mjs and bench/verify-property.mjs add fixed and randomized cross-implementation equivalence; bench/verify-writes.mjs validates post-write state on both engines."
      epistemic_limit: "These finite checks establish evidence of conformance to the declared benchmark task for tested inputs and comparability among implementations; they are not a proof of correctness for all possible inputs."
    - id: M2
      name: treatment_definition
      requirement: "Fix each treatment's implementation and strategy by a rule declared reproducibly in advance. The protocol REQUIRES such a rule but PRIVILEGES NONE; documentation-first is one instantiation."
      check: "The selection rule is stated before measurement and applied uniformly; ties are broken by a stated tie-breaker."
      failure_if_skipped: "The query strategy chosen for a library is silently conflated with the library's own cost."
      this_study: "Policy-selected documented configuration (first documented relation API under the archived-page conflict rule, with a documented-base-layer tie-break); this is the experiment's artificial policy, not a practitioner-behavior model or protocol requirement."

  recommended:
    - id: R3
      name: common_sql_raw_path_sensitivity
      requirement: "Add a contrast in which layers execute common SQL through their raw facilities."
      reports: "A residual spread (a diagnostic contrast), NOT a causal decomposition and NOT a bound on the intrinsic library effect."
      this_study: "Common-SQL raw-path sensitivity contrast (Supplement Table S42); deep-fetch spread 7.01x/5.12x in the policy-selected documented treatment vs 1.71x/2.03x through raw facilities."
    - id: R4
      name: capacity_characterization
      requirement: "Locate estimated saturating throughput per treatment by a concurrency sweep, so the fixed operating point can be read against capacity."
      this_study: "Per-pattern concurrency sweep (Supplement Table S35); knees at or below 50 connections, 98-100% median utilization (minimum 87%) at the operating point."
    - id: R5
      name: operating_point_separation
      requirement: "Measure the tail at equal external demand AND at matched fractions of each treatment's estimated capacity, with denominator uncertainty disclosed; report them as distinct quantities."
      this_study: "High-load p99 under equal closed-loop demand versus matched-utilization tail (Supplement Tables S21-S22 and S43), with bootstrap and full-sweep denominator sensitivity (S45); the stable 50% and most 70% cells form a small band, while 85-95% cells are only near-saturation trends."

    - id: R6
      name: resource_accounting
      requirement: "Report compute and memory use with throughput, or add a clearly labelled equal-budget sensitivity comparison."
      reports: "Whether a throughput ordering persists when resource demand is exposed or constrained."
      this_study: "Application, database, and generator CPU plus peak RSS are reported; the deep fetch also has an exploratory equal-CPU comparison."
    - id: R7
      name: implementation_waste_evidence
      requirement: "Record evidence that no compared implementation does avoidable work on the timed path beyond the declared task, and the disposition of anything found. Evidence may be MECHANICAL (checks that reject diagnostic output written during a measured run, and detect values acquired but never read in adapter sources) or HUMAN (independent review by someone other than the implementer). Mechanical evidence is preferred because it is reproducible and rerunnable; human review is accepted but not required."
      reports: "Whether semantic equivalence is complemented by evidence against correct-but-needlessly-slow adapter code. A clean result bounds the classes the checks cover; it is not a proof that no waste remains."
      this_study: "Mechanical evidence, both rerunnable. (i) scripts/verify-dead-work.mjs scans all 13 adapter modules for values acquired and never read; it is clean, and is validated against the real pre-fix source of finding ASA-02, which it reports (bench/dead-work.test.mjs). This applies to the archived measured source. (ii) bench/diagnostics.mjs rejects any cell whose treatment writes to stderr/stdout during a measured run; it is installed for subsequent campaigns and did NOT gate the reported campaign, where absence of timed-path output was established by author observation after finding ASA-01. Result-blind human-review packets remain available under notes/reviewer-packets but are no longer required by this stage; none has been completed."

cell_admission:
  rule: "Time a (treatment, workload-point) cell ONLY if semantic admission passes: specification-conformant and mutually equivalent non-mutating outputs, plus correct post-write state."
  disqualifiers:
    - "expected-result mismatch against the declared task specification"
    - "non-equivalent output under the declared cross-implementation comparator"
    - "invalid or unsuccessful write state"

outputs:
  reports: "Throughput and tail latency per operating point."
  interpretation:
    - "Descriptive of the treatment as defined - not a causal decomposition."
    - "Rankings are configuration-specific and version-specific."
    - "Relative differences are reported within the declared condition; transfer across environments requires independent evaluation."

applicability_limits:
  byte_identical_comparison_valid_when: "Equivalent outputs are deterministic and canonically serializable."
  otherwise_use_semantic_comparator_for:
    - "unordered collections (set equality)"
    - "floating-point values (numeric tolerance)"
    - "timestamps and nondeterministic identifiers (canonicalization)"
    - "differently serialized but equivalent representations"

compliance_levels:
  levels:
    - id: L1
      name: mandatory_validity_core
      holds_when: "M1 and M2 hold for the cell."
    - id: L2
      name: capacity_characterization
      holds_when: "R4 has located the cell's throughput knee."
    - id: L3
      name: common_sql_sensitivity_extension
      holds_when: "R3 common-SQL raw-path contrast has been run for the cell."
    - id: L4
      name: utilization_controlled_extension
      holds_when: "R5 matched-utilization tail has been measured for the cell and its capacity denominator is stated."
    - id: L5
      name: resource_accounting_extension
      holds_when: "R6 resource use or an equal-compute sensitivity is reported."
    - id: L6
      name: independently_reviewed_implementation_extension
      holds_when: "R7 has a recorded independent review and disposition for every treatment in scope."
  coverage_in_this_study: "L1 and L2 hold across all five patterns on both engines; L3-L5 are demonstrated on the deep fetch as a representative-point instantiation. L6 is pending independent human review and is not counted as satisfied."
